# https://release-plz.ieni.dev/docs/config
[workspace]
changelog_update = true
changelog_path = "./CHANGELOG.md"
git_release_enable = true
git_release_type = "auto"
git_tag_enable = true
publish = true
publish_allow_dirty = false
semver_check = true
allow_dirty = false

# One version for the whole workspace. `version.workspace = true` keeps the
# manifests in step; this keeps release-plz in step too, since on its own it
# versions each crate by that crate's own commits and they drift apart.
# `version_group` cannot be set in [workspace], so every member is listed.

[[package]]
name = "dsl-knowledge"
version_group = "duck-sqllsp"

[[package]]
name = "dsl-parse"
version_group = "duck-sqllsp"

[[package]]
name = "dsl-resolve"
version_group = "duck-sqllsp"

[[package]]
name = "dsl-catalog"
version_group = "duck-sqllsp"

[[package]]
name = "dsl-completion"
version_group = "duck-sqllsp"

[[package]]
name = "dsl-hover"
version_group = "duck-sqllsp"

[[package]]
name = "dsl-conn"
version_group = "duck-sqllsp"

[[package]]
name = "dsl-analysis"
version_group = "duck-sqllsp"

[[package]]
name = "dsl-format"
version_group = "duck-sqllsp"

[[package]]
name = "dsl-server"
version_group = "duck-sqllsp"

[[package]]
name = "duck-sqllsp"
version_group = "duck-sqllsp"
