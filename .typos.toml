# https://github.com/crate-ci/typos
[files]
extend-exclude = [
  "target/",
  "node_modules/",
  "tmp/",
  "tmp*/",
  "temp/",
  "temp*/",
  ".next/",
  ".gentleduck/",
  ".dmc/",
  "Cargo.lock",
  "pnpm-lock.yaml",
  "package-lock.json",
  "duck-benchmarks/**/*.json",
  "duck-benchmarks/**/*.svg",
  "dmc-highlight/assets/",
  "*.svg",
  # CommonMark / GFM spec suites and fuzz corpus: byte-exact test data,
  # the "misspellings" are part of the cases.
  "dmc-parser/tests/fixtures/",
  "fuzz/seeds/",
  "fuzz/corpus/",
]

[default]
extend-ignore-identifiers-re = [
  # napi triple naming, intentional
  "freebsd-x64",
  # rust toolchain conventions
  "rustfmt",
  "clippy",
  # crate names
  "duktape",
  "ducc",
  "katex",
  "syntect",
  "pulldown-latex",
  "pulldown",
  "rehype",
  "remark",
  "shiki",
]

[default.extend-words]
# project-specific words that look misspelled but aren't
dmc = "dmc"
mdx = "mdx"
napi = "napi"
gentleduck = "gentleduck"

# SQL keyword prefixes and deliberately-misspelled identifiers used as
# test fixtures. The completion engine is tested by feeding it partial
# keywords (`SELEC`, `WHER`, ...), and several analysis rules are tested
# with the very typos they exist to catch (`emial`, `tre`).
CHEC = "CHEC"
COMMEN = "COMMEN"
DELET = "DELET"
EXECUT = "EXECUT"
FUNCTIO = "FUNCTIO"
INSER = "INSER"
RETUR = "RETUR"
SAV = "SAV"
SELEC = "SELEC"
SELEKT = "SELEKT"
UNIQU = "UNIQU"
UPDAT = "UPDAT"
WHE = "WHE"
WHER = "WHER"
emial = "emial"
tre = "tre"

# Real SQL / PostgreSQL vocabulary that looks like a typo.
brin = "brin"
iif = "iif"
tru = "tru"
PARMS = "PARMS"

# Hyphenated prose prefixes ("mis-parse", "mis-identify") and word
# fragments the checker splits out of larger identifiers ("RETURNed" ->
# "Ned", "rest_after_ine" for IF-NOT-EXISTS).
mis = "mis"
Ned = "Ned"
# "ANDed" -- the SQL operator with an -ed suffix.
Ded = "Ded"
ine = "ine"
# `hom` is verbatim from the PostgreSQL docs example for OVERLAY.
hom = "hom"
# Short local bindings and a test fixture filename.
pn = "pn"
ot = "ot"

# Identifiers from dependencies and local code.
# `larg` is pg_query's own field name for a join's left argument.
larg = "larg"
clen = "clen"
crypted = "crypted"
unparseable = "unparseable"
