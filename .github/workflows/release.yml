name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

# Single in-flight release at a time across the org's pinned crates so
# release-plz never trips over itself if two pushes land back-to-back.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-pr:
    name: "release-plz: open / refresh release PR"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-publish:
    name: "release-plz: tag + publish to crates.io"
    needs: release-plz-pr
    # The crates-io environment requires manual approval before this job
    # runs, so an accidental merge to master cannot push to crates.io.
    environment: crates-io
    runs-on: ubuntu-latest
    steps:
      # Without a registry token `cargo publish` fails with "please
      # provide a non-empty token", which failed this workflow on every
      # single push to master. A red Release run then says nothing about
      # whether releasing actually works -- it is red either way. Skip
      # with a notice instead, and let a real failure mean something.
      #
      # The secret goes through `env` rather than into the command
      # string, so it is never interpolated into a shell argument.
      - id: guard
        env:
          REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped::CARGO_REGISTRY_TOKEN is not set, so nothing was published to crates.io. Set the repository secret to enable releases."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.configured == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.configured == 'true'
      - uses: MarcoIeni/release-plz-action@v0.5
        if: steps.guard.outputs.configured == 'true'
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # release-plz only knows about cargo crates, so the extension needs its own
  # tag. Deliberately not `needs:` the publish job: that one is skipped when
  # there is no registry token, and a skipped need would silently skip this.
  vscode-extension:
    name: "vscode extension: tag + attach vsix"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        run: |
          version=$(node -p "require('./vscode-extension/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=vscode-extension-v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/vscode-extension-v$version" >/dev/null 2>&1; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already tagged::vscode-extension-v$version exists. Bump the version in vscode-extension/package.json to cut a new one."
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.meta.outputs.tagged == 'false'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - if: steps.meta.outputs.tagged == 'false'
        working-directory: vscode-extension
        run: |
          npm ci
          npx --yes @vscode/vsce package --out "duck-sqllsp-vscode-${{ steps.meta.outputs.version }}.vsix"
      - if: steps.meta.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "VS Code extension ${{ steps.meta.outputs.version }}" \
            --notes "Install with \`code --install-extension\` on the attached .vsix." \
            "vscode-extension/duck-sqllsp-vscode-${{ steps.meta.outputs.version }}.vsix"
