name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - '.github/**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.github/**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.job }}
      - run: cargo clippy --workspace --all-features -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.job }}-${{ matrix.os }}
      - run: cargo test --workspace --all-features

  feature-matrix:
    name: cargo check (feature combos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.job }}
      - run: cargo check --workspace --no-default-features
      - run: cargo check --workspace --all-features

  vscode-extension:
    name: vscode extension (typecheck + bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      # The extension ships the server, so a mismatch means the marketplace
      # build and the crate it drives are different releases.
      - name: version matches the workspace
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          ext=$(node -p "require('./vscode-extension/package.json').version")
          if [ "$crate" != "$ext" ]; then
            echo "::error::workspace is $crate but vscode-extension/package.json is $ext"
            exit 1
          fi
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run compile
        working-directory: vscode-extension
      - run: npm run bundle
        working-directory: vscode-extension
