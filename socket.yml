# https://docs.socket.dev/docs/socket-yml
version: 2

projectIgnorePaths:
  - 'target/**'
  - 'node_modules/**'
  - 'tmp/**'
  - 'tmp*/**'
  - 'temp/**'
  - 'temp*/**'
  - 'dsl-analysis/docs/rules.md'

githubApp:
  enabled: true
  projectReportsEnabled: true
  pullRequestAlertsEnabled: true
  secretScanningEnabled: true

issueRules:
  malware: error
  gptMalware: error
  gptSecurity: warn
  installScripts: warn
  envVars: warn
  unresolvedRequire: warn
  hasNativeCode: warn
  shellAccess: warn
  filesystemAccess: warn
  networkAccess: warn

  obfuscatedFile: warn
  troll: warn
  telemetry: warn

  # The only npm surface here is the VS Code extension, whose single
  # runtime dependency is `vscode-languageclient`.
  unpopularPackage: ignore
  newAuthor: ignore
