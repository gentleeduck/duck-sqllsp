# https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
  # RUSTSEC-2023-0071 -- "Marvin Attack" timing sidechannel in `rsa`.
  #
  # Reached only through sqlx-mysql, which uses RSA to encrypt the
  # password during the MySQL `sha256_password` /
  # `caching_sha2_password` handshake:
  #
  #     rsa v0.9.10 <- sqlx-mysql <- sqlx
  #
  # The advisory states outright that no safe upgrade is available, and
  # the only workaround offered is to avoid the crate where an attacker
  # can observe timing -- which is not something a schema-introspection
  # client can arrange. It is unreachable unless the user configures a
  # MySQL connection, and MySQL is a first-class dialect here, so
  # dropping the driver is not an option either.
  #
  # Re-evaluate whenever RustCrypto/RSA#626 lands a constant-time
  # implementation.
  "RUSTSEC-2023-0071",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "0BSD",
  "CC0-1.0",
  # webpki-roots ships Mozilla's CA certificate bundle as data under the
  # Community Data License Agreement. Pulled in by sqlx's rustls TLS.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
